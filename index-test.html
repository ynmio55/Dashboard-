<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #fff; display: flex; justify-content: center; padding: 50px; }
    svg { width: 300px; height: auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <svg viewBox="0 0 100 150">
    <!-- Base Body Shapes -->
    <ellipse cx="50" cy="14" rx="12" ry="16" fill="#dfe8ef" stroke="#8aa1b3" /> <!-- Head -->
    
    <!-- Torso -->
    <rect x="36" y="32" width="28" height="50" fill="#dbe6ef" stroke="#8aa1b3" />

    <!-- Upper Arms -->
    <rect x="25" y="32" width="10" height="25" rx="5" fill="#dfe8ef" stroke="#8aa1b3" />
    <rect x="65" y="32" width="10" height="25" rx="5" fill="#dfe8ef" stroke="#8aa1b3" />
    
    <!-- Upper Legs -->
    <rect x="35" y="85" width="12" height="25" rx="4" fill="#dfe8ef" stroke="#8aa1b3" />
    <rect x="53" y="85" width="12" height="25" rx="4" fill="#dfe8ef" stroke="#8aa1b3" />
    
    <!-- Lower Legs -->
    <rect x="36" y="115" width="10" height="25" rx="4" fill="#dfe8ef" stroke="#8aa1b3" />
    <rect x="54" y="115" width="10" height="25" rx="4" fill="#dfe8ef" stroke="#8aa1b3" />

    <!-- Colored Body Parts overlaid -->
    <ellipse cx="50" cy="28" rx="8" ry="5" fill="#d83a50" opacity="0.8" /> <!-- คอ -->

    <ellipse cx="30" cy="32" rx="11" ry="7" fill="#d83a50" opacity="0.8" /> <!-- ไหล่ Left -->
    <ellipse cx="70" cy="32" rx="11" ry="7" fill="#d83a50" opacity="0.8" /> <!-- ไหล่ Right -->

    <ellipse cx="50" cy="45" rx="16" ry:="10" fill="#f5be42" opacity="0.8" /> <!-- หลังส่วนบน -->
    <ellipse cx="50" cy="65" rx="16" ry:="10" fill="#f5be42" opacity="0.8" /> <!-- หลังส่วนล่าง -->

    <ellipse cx="50" cy="83" rx="20" ry="6" fill="#f5be42" opacity="0.8" /> <!-- สะโพก -->

    <ellipse cx="30" cy="68" rx="6" ry="14" fill="#f5be42" opacity="0.8" /> <!-- แขนท่อนล่าง Left -->
    <ellipse cx="70" cy="68" rx="6" ry="14" fill="#f5be42" opacity="0.8" /> <!-- แขนท่อนล่าง Right -->

    <ellipse cx="29" cy="88" rx="6" ry="6" fill="#eb6876" opacity="0.8" /> <!-- มือ/ข้อมือ Left -->
    <ellipse cx="71" cy="88" rx="6" ry="6" fill="#eb6876" opacity="0.8" /> <!-- มือ/ข้อมือ Right -->

    <ellipse cx="41" cy="110" rx="7" ry="5" fill="#d4ad65" opacity="0.8" /> <!-- เข่า Left -->
    <ellipse cx="59" cy="110" rx="7" ry="5" fill="#d4ad65" opacity="0.8" /> <!-- เข่า Right -->

    <ellipse cx="41" cy="125" rx="5" ry="10" fill="#d4ad65" opacity="0.8" /> <!-- น่อง Left -->
    <ellipse cx="59" cy="125" rx="5" ry="10" fill="#d4ad65" opacity="0.8" /> <!-- น่อง Right -->

    <ellipse cx="41" cy="142" rx="8" ry="4" fill="#d4ad65" opacity="0.8" /> <!-- เท้า Left -->
    <ellipse cx="59" cy="142" rx="8" ry="4" fill="#d4ad65" opacity="0.8" /> <!-- เท้า Right -->
  </svg>
</body>
</html>
